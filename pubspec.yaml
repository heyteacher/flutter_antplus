name: flutter_antplus
description: "A new Flutter Ant+ plugin"
version: 0.1.0+1
homepage:

environment:
  sdk: ^3.12.0-327.4.beta
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  logging: ^1.3.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_heyteacher_meta: ^7.6.9+178 
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        package: me.heyteacher.flutter_antplus
        pluginClass: FlutterAntplusPlugin
