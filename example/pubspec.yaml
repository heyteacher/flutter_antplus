name: flutter_antplus_example
description: "Demonstrates how to use the flutter_antplus plugin."
publish_to: "none"

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ^3.47.0

dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  flutter_antplus:
    path: ../
  flutter_heyteacher_locale: ^3.2.1+166
  flutter_heyteacher_logger: ^3.1.1+172
  flutter_heyteacher_views: ^7.1.1+193
  flutter_localizations:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  go_router: ^18.1.3
  logging: ^1.3.0
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_heyteacher_meta: ^7.10.1+193
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
