name: flutter_antplus_example
description: "Demonstrates how to use the flutter_antplus plugin."
publish_to: "none"

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ^3.47.0

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_antplus:
    path: ../
  flutter_heyteacher_locale: ^3.1.0+157
  flutter_heyteacher_logger: ^3.0.4+161
  flutter_heyteacher_views: ^4.3.0+169
  flutter_localizations:
    sdk: flutter
  font_awesome_flutter: ^11.0.0
  go_router: ^17.3.0
  logging: ^1.3.0
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_heyteacher_meta: ^7.9.0+183
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
